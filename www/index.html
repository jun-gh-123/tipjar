<html>
  <head>
    <title>Sui Tip Jar</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/water.css@2/out/dark.css"
    />
    <style>
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      #tipUI {
        display: flex;
        flex-direction: column;
      }

      #customTipContainer {
        display: flex;
        align-items: center;
      }

      #submitTip {
        margin-top: 20px;
        background: royalblue;
        align-self: center;
        border-radius: 20px;
      }
    </style>
  </head>
  <body>
    <h1>Sui Tip Jar</h1>
    <mysten-dapp-kit-connect-button></mysten-dapp-kit-connect-button>
    <div id="tipUI" hidden>
      <div class="amount">
        <h3>Amount</h3>
        <div id="tipAmounts"></div>
        <h3>Token</h3>
        <select id="tipToken">
          <option value="sui">SUI</option>
          <option value="usdc">USDC (SUI)</option>
        </select>
      </div>
      <button id="submitTip">Tip</button>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
