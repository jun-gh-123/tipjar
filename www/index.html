<html>
  <head>
    <title>Tip Jar (Sui)</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/water.css@2/out/light.css"
    />
    <style>
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      #tipUI {
        display: none;
        flex-direction: column;
      }

      #customTipContainer {
        display: flex;
        align-items: center;
      }

      #submitTip {
        color: white;
        margin-top: 20px;
        background: #298dff;
        align-self: center;
        border-radius: 20px;
        box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.4);
      }

      #thankYouDialogContent {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      #closeThankYouDialog {
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <h1>Tip Jar (Sui)</h1>
    <div id="connectButtonContainer" hidden>
      <mysten-dapp-kit-connect-button></mysten-dapp-kit-connect-button>
    </div>
    <progress id="walletConnectProgress"></progress>
    <div id="tipUI">
      <div class="amount">
        <h3>Amount</h3>
        <div id="tipAmounts"></div>
        <h3>Token</h3>
        <select id="tipToken">
          <option value="usdc">USDC (SUI)</option>
          <option value="sui">SUI</option>
        </select>
      </div>
      <button id="submitTip">Tip</button>
    </div>
    <dialog id="thankYouDialog">
      <div id="thankYouDialogContent">
        <h3>Thanks. You're the best.</h3>
        <img src="./thanku.gif" />
        <button id="closeThankYouDialog">Yes</button>
      </div>
    </dialog>
    <script src="./app.js"></script>
  </body>
</html>
